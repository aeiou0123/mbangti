<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBanGTI - BanG Dream! 角色人格测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --neon-pink: #ff2a85;
            --neon-blue: #00f0ff;
            --neon-purple: #b5179e;
            --neon-yellow: #fbee0f;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 42, 133, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.08), transparent 25%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, .band-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .neon-text-pink {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink), 0 0 40px var(--neon-pink);
        }
        .neon-text-blue {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-blue), 0 0 30px var(--neon-blue);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .guitar-pick-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            border: 2px solid transparent;
            border-image: linear-gradient(45deg, var(--neon-pink), var(--neon-blue)) 1;
            transition: all 0.3s ease;
            clip-path: polygon(10% 0, 90% 0, 100% 20%, 100% 80%, 90% 100%, 10% 100%, 0 80%, 0 20%);
        }

        .guitar-pick-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--neon-blue) inset;
        }

        .option-btn {
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .option-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--neon-pink);
            transform: translateX(5px);
        }

        .progress-bar-container {
            background: rgba(255,255,255,0.1);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Star Animation */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite linear;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px #fff; }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* Fade transitions */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 0.5s, transform 0.5s; }
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="antialiased text-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Star Background -->
    <div class="stars" id="stars-container"></div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-3xl glass-panel rounded-2xl p-6 md:p-10 relative overflow-hidden">
        
        <!-- === HOME SCREEN === -->
        <div id="screen-home" class="flex flex-col items-center text-center space-y-8">
            <div class="mb-4">
                <h1 class="text-5xl md:text-7xl font-bold mb-2 neon-text-pink band-font tracking-wider">MBanGTI</h1>
                <p class="text-xl md:text-2xl text-cyan-300 font-light mt-4 tracking-widest"><i class="fas fa-guitar mr-2"></i>BanG Dream! 角色人格深度映射</p>
            </div>
            
            <p class="text-gray-300 leading-relaxed text-sm md:text-base max-w-2xl text-left">
                在现代虚拟偶像企划中，角色的性格已演进为复杂的心理学网络。本系统基于荣格八维认知功能与《BanG Dream!》宇宙深度叙事相缝合，为你解码内在灵魂的羁绊。
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-xl mt-8">

                    <span class="text-xl font-bold band-font mb-1">日常简化版</span>
                    <span class="text-xs text-gray-400">20题 · 轻松圈内日常</span>
                </button>
                
                <button onclick="startQuiz('hard')" class="guitar-pick-btn py-6 px-4 flex flex-col items-center group cursor-pointer" style="border-image: linear-gradient(45deg, var(--neon-purple), var(--neon-yellow)) 1;">
                    <i class="fas fa-mask text-3xl mb-3 text-purple-400 group-hover:text-white transition-colors"></i>
                    <span class="text-xl font-bold band-font mb-1">硬核剧情版</span>
                    <span class="text-xs text-gray-400">40题 · 直击灵魂撕裂</span>
                </button>
            </div>
        </div>

        <!-- === QUIZ SCREEN === -->
        <div id="screen-quiz" class="hidden-screen flex-col w-full">
            <div class="flex justify-between items-center mb-6">
                <span id="quiz-mode-badge" class="px-3 py-1 bg-purple-900/50 text-purple-300 text-xs rounded-full border border-purple-500/30">硬核剧情版</span>
                <span class="text-sm font-mono text-cyan-400"><span id="current-q-num">1</span> / <span id="total-q-num">20</span></span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-container h-2 w-full mb-8">
                <div id="progress-fill" class="progress-bar-fill h-full w-0"></div>
            </div>

            <!-- Question -->
            <div class="min-h-[120px] mb-8">
                <h2 id="question-text" class="text-xl md:text-2xl font-bold leading-relaxed">题目加载中...</h2>
            </div>

            <!-- Options -->
            <div class="flex flex-col space-y-4">
                <button onclick="selectOption('A')" class="option-btn bg-gray-800/60 p-5 rounded-lg text-left flex items-start border border-gray-700 w-full group">
                    <span class="text-pink-500 font-bold mr-4 mt-0.5 group-hover:text-pink-400">A.</span>
                    <span id="option-a-text" class="text-gray-200 leading-relaxed text-sm md:text-base">选项A</span>
                </button>
                <button onclick="selectOption('B')" class="option-btn bg-gray-800/60 p-5 rounded-lg text-left flex items-start border border-gray-700 w-full group">
                    <span class="text-blue-500 font-bold mr-4 mt-0.5 group-hover:text-blue-400">B.</span>
                    <span id="option-b-text" class="text-gray-200 leading-relaxed text-sm md:text-base">选项B</span>
                </button>
            </div>
        </div>

        <!-- === RESULT SCREEN === -->
        <div id="screen-result" class="hidden-screen flex-col items-center w-full fade-enter">
            <div class="text-center mb-6">
                <p class="text-gray-400 mb-2 uppercase tracking-widest text-sm">你的灵魂共振类型</p>
                <h1 id="result-mbti" class="text-6xl md:text-8xl font-bold neon-text-blue band-font mb-4">INTJ</h1>
                <h2 id="result-title" class="text-2xl md:text-3xl font-bold text-pink-400 mb-6">建筑师</h2>
            </div>

            <div class="w-full bg-gray-900/50 border border-gray-700 p-6 rounded-xl mb-8 shadow-inner relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl"><i class="fas fa-music"></i></div>
                <h3 class="text-lg font-bold text-cyan-300 mb-4 border-b border-gray-700 pb-2"><i class="fas fa-users mr-2"></i>灵魂共鸣角色</h3>
                <div id="result-characters" class="flex flex-wrap gap-3 mb-6">
                    <!-- Character badges injected via JS -->
                </div>
                
                <h3 class="text-lg font-bold text-cyan-300 mb-2"><i class="fas fa-book-open mr-2"></i>荣格八维解析与剧情表现</h3>
                <p id="result-desc" class="text-gray-300 text-sm md:text-base leading-relaxed">
                    加载中...
                </p>
            </div>

            <button onclick="resetApp()" class="px-8 py-3 bg-gradient-to-r from-pink-600 to-purple-600 rounded-full font-bold text-white shadow-[0_0_15px_rgba(255,42,133,0.5)] hover:shadow-[0_0_25px_rgba(255,42,133,0.8)] transition-all transform hover:-translate-y-1">
                <i class="fas fa-redo mr-2"></i>再次测试
            </button>
        </div>

    </main>

    <footer class="mt-8 text-center text-gray-500 text-xs">
        <p>基于《BanG Dream!》全企划角色 MBTI 深度映射数据构建</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // === DATA SOURCE (Extracted from Document) ===
        
        // 16 Types Mapping
        const mbtiData = {
            "INTJ": { title: "建筑师", roles: ["凑友希那 (Roselia)", "八潮瑠唯 (Morfonica)"], axis: "Ni-Te 轴", desc: "具备极致的战略远见与绝对的执行力。构筑登顶或存续的宏大愿景，以外倾思考(Te)进行近乎冷酷的功利主义评估与合理性推演，是纯粹的理性基石。" },
            "INTP": { title: "逻辑学家", roles: ["青叶摩卡 (Afterglow)", "大和麻弥 (Pastel*Palettes)"], axis: "Ti-Ne 轴", desc: "内在逻辑严密且充满发散性思维。表面慵懒或狂热，实则通过内倾思考(Ti)建立自己的哲学，敏锐捕捉外界情绪波动，总是以旁观者或极客视角化解危机。" },
            "ENTJ": { title: "指挥官", roles: ["CHU2 (RAS)", "白鹭千圣 (PasuPare)", "丰川祥子 (Ave Mujica)"], axis: "Te-Ni 轴", desc: "绝对的支配者与务实主义者。利用现实数据强行斩断过去，展现出冷酷的实用主义与保全全局的计算，将他人视为构建完美面具舞台的棋子。" },
            "ENTP": { title: "辩论家", roles: ["弦卷心 (HHW)", "冰川日菜 (PasuPare)"], axis: "Ne-Ti 轴", desc: "不受任何世俗框架限制的灵感制造机。典型的跳跃性天才，对事物充满解构的欲望，脑海中永远有疯狂的计划，展现出特有的情感疏离与智力优越。" },
            "INFJ": { title: "提倡者", roles: ["长崎爽世 (MyGO!!!!!)", "广町七深 (Morfonica)"], axis: "Ni-Fe 轴", desc: "表面温和实则执念极深的操控者。利用外倾情感扮演温柔角色以维持环境和谐，实则是为了满足内心偏执的愿景。一旦面具崩塌，会展露极强心理操控欲。" },
            "INFP": { title: "调停者", roles: ["高松灯 (MyGO!!!!!)", "仓田真白 (Morfonica)", "白金燐子 (Roselia)"], axis: "Fi-Ne 轴", desc: "极度内耗且精神世界宏大的创作者。无法正常社交，极易受外界打击而退缩，但最终凭借内心的纯粹信仰与对“一辈子”的极致渴望重返舞台。" },
            "ENFJ": { title: "主人公", roles: ["濑田薰 (HHW)", "三角初华 (Ave Mujica)"], axis: "Fe-Ni 轴", desc: "天生的情感领袖与共情者。用戏剧化行径为所有人提供情绪价值；极度珍视友谊，即便在压抑的环境中，依然是维系人际关系并期望所有人幸福的光芒。" },
            "ENFP": { title: "竞选者", roles: ["户山香澄 (Poppin'Party)", "宇田川亚子 (Roselia)"], axis: "Ne-Fi 轴", desc: "用热情打破坚冰的奇迹制造者。循着虚幻直觉，凭借极高浓度的感染力将伙伴拉入引力场。用不受限的青春活力软化严肃冰冷的内部氛围。" },
            "ISTJ": { title: "物流师", roles: ["冰川纱夜 (Roselia)", "椎名立希 (MyGO!!!!!)", "若叶睦 (Ave Mujica)"], axis: "Si-Te 轴", desc: "秩序的拥趸与沉默的坚守者。依靠极端刻苦的重复训练对抗阴影；或默默承受周遭的撕裂，将情感具象化，像齿轮一样恪守底线，对规则极度执着。" },
            "ISFJ": { title: "守卫者", roles: ["羽泽鸫 (Afterglow)", "牛込里美 (Poppin'Party)"], axis: "Si-Fe 轴", desc: "团队的隐形粘合剂。凭借极高的包容度与耐力，敏锐缝合他人的逞强与伪装，是维持羁绊与团队稳定运转的定海神针。" },
            "ESTJ": { title: "总经理", roles: ["二叶筑紫 (Morfonica)"], axis: "Te-Si 轴", desc: "富有责任感的班长型角色。总是试图在团队中建立绝对可靠的权威形象，通过制定严格的计划和规章制度来推动乐队前进，哪怕自身偶尔显得笨拙。" },
            "ESFJ": { title: "执政官", roles: ["千早爱音 (MyGO!!!!!)", "上原绯玛丽 (Afterglow)"], axis: "Fe-Si 轴", desc: "极其在意社交氛围的润滑剂。卓越的同理心和破冰能力是拯救濒临解散团队的解药。通过眼泪与拥抱提供情绪泄洪通道的典型守护者。" },
            "ISTP": { title: "鉴赏家", roles: ["花园多惠 (Poppin'Party)", "八幡海铃 (Ave Mujica)"], axis: "Ti-Se 轴", desc: "活在物理世界的高级技术流。看似电波或游走于多方之间，实则看透虚伪抓马，坚持“拿钱办事”或随心所欲的绝对理性与物理技术抽离。" },
            "ISFP": { title: "探险家", roles: ["美竹兰 (Afterglow)", "松原花音 (HHW)"], axis: "Fi-Se 轴", desc: "将反叛或深情化为行动的感知者。不善言辞，其内心深处对执念的坚守完全通过外倾感觉（如激烈的摇滚嗓音或勇敢的行动）来宣泄。" },
            "ESTP": { title: "企业家", roles: ["祐天寺喵梦 (Ave Mujica)", "佐藤益姬 (RAS)"], axis: "Se-Ti 轴", desc: "极具现实嗅觉的现世投机者与行动派。精明捕捉流量热点，毫不留情利用他人创伤为自身资本；或凭借身体直觉打鼓，缺乏传统道德共情羁绊。" },
            "ESFP": { title: "表演者", roles: ["PAREO (RAS)", "北泽育美 (HHW)"], axis: "Se-Fi 轴", desc: "极致的舞台感官爆发者。为了迎合审美或释放天性，彻底改造成五颜六色的姿态。舞台表现力与内心狂热完美契合了燃烧自我照亮他人的特质。" }
        };

        // Questions Array [ID, Dimension, Question, OptionA(Positive), OptionB(Negative)]
        // A corresponds to the FIRST letter of the dimension, B to the SECOND letter.
        const questionsDB = [
            // --- 简化版题库 (1-20) ---
            [1, "E/I", "【能量导向】Livehouse CiRCLE 举办全员联合交流会。面对这种高密度的社交场合，你的能量补充机制是：", "兴奋地穿梭在各个乐队之间，频繁交换乐器技巧与生活趣闻，在外部互动中获得能量充电。", "倾向于待在熟悉的角落，或者寻找一个绝对安静的隔间独自练习，外部社交会迅速耗尽你的电量。"],
            [2, "S/N", "【信息感知】乐队准备构思一首全新的原创曲词。在捕捉灵感时，你的注意力通常会首先聚焦于：", "大家在家庭餐厅分食大份薯条、在商店街避雨等触手可及的真实物理记忆与细节。", "试图提炼出诸如“星之鼓动”或“迷失的指南针”等带有强烈隐喻与象征意义的抽象哲学概念。"],
            [3, "T/F", "【决策逻辑】在临近 Live 的关键排练中，某位成员反复弹错同一个和弦导致节奏崩溃。作为观察者，你的首要干预手段是：", "立即打断排练，客观分析是肌肉记忆错误还是节拍器偏差，以技术纠错为第一要务。", "优先感知到对方的挫败感，提议全体休息，并在私下提供温和的情绪安抚与支持。"],
            [4, "J/P", "【生活方式】为了迎接即将到来的两校联合学园祭压轴演出，你的时间规划倾向是：", "提前数周制定精确到天的进度表，包含设备检查、服装确认，并强迫团队严格遵守。", "认为过度的计划会扼杀灵感，倾向于保留极大的灵活度，甚至允许在演出前夜大幅修改前奏。"],
            [5, "E/I", "【能量导向】在羽泽咖啡店经历了一场长达三小时的喧闹姐妹聚会后，你的心理状态倾向于：", "意犹未尽，大脑处于高度兴奋状态，甚至在回家的电车上就开始在群聊里策划下一次聚会。", "虽然度过了愉快的时光，但感到心理电量已彻底告罄，急需回到完全私人的空间里放空回血。"],
            [6, "S/N", "【信息感知】走进乐器店准备挑选一把新的吉他或贝斯时，影响你最终决策的核心信息是：", "乐器的木材密度、拾音器的客观参数、琴颈的手感反馈，以及它在同等价位中的实际表现数据。", "这把琴在灯光下散发出的气质是否与你心中的某种“宿命感”契合，它能否成为你灵魂的延伸。"],
            [7, "T/F", "【决策逻辑】两名队友因为舞台服装的风格设定产生严重分歧并陷入冷战。在试图调解时，你的切入点是：", "避开情绪旋涡，直接将两套方案的成本、舞台反光率与活动主题匹配度列出，用绝对客观的优劣来裁决。", "将两人分开，分别倾听她们坚持某种风格背后的心理动机，以修复人际关系的裂痕作为最终目的。"],
            [8, "J/P", "【生活方式】约定好在家庭餐厅召开紧急企划会议，但核心成员迟迟未到。你的应激反应是：", "感到明显的焦虑与不悦，认为不守时的行为破坏了预定的效率，打乱了你脑海中规划好的日程链条。", "觉得这属于意料之中的变量，随遇而安地点一份芭菲，享受这段突如其来的真空时间。"],
            [9, "E/I", "【能量导向】当你们的乐队突然在社交网络上引发病毒式传播，面对成千上万的关注目光，你会：", "视其为绝佳的自我展现舞台，立刻开启高频的直播与互动，享受成为客体世界焦点的快感。", "本能地感到一种被侵入的恐慌，默默关闭手机通知，竭力维护自己内在精神世界的边界不被打破。"],
            [10, "S/N", "【信息感知】在聆听一首结构极其复杂的前卫摇滚（如 Roselia 的核心曲目）后，你的反馈侧重于：", "惊叹于鼓手在变拍子时的精准度，或是键盘合成器在特定小节切入时的音色还原度。", "完全沉浸在音乐构建的“在深渊中寻求救赎”的宏大叙事画面中，被其传达的整体意境所震撼。"],
            [11, "T/F", "【决策逻辑】最好的朋友在顶级乐团的试音考核中惨遭淘汰，情绪崩溃。作为挚友，你的本能反应是：", "压抑住同情的泛滥，帮她理性复盘试音过程中的技术失误，并着手为她规划下一次的针对性特训。", "提供绝对无条件的共情，告诉她“这不是你的错”，在当下只做一个情绪的垃圾桶和坚实的拥抱者。"],
            [12, "J/P", "【生活方式】面对一个既没有排练任务也没有学校作业的完全空白的休息日，你的默认模式是：", "在前一天睡前就已经在脑海中列好了今天几点去买唱片、几点看电影的清单，并享受划掉清单的掌控感。", "没有任何预设，睡到自然醒后凭着当下的直觉出门，可能会因为偶然遇到一只流浪猫而改变整天的轨迹。"],
            [13, "E/I", "【能量导向】当站在聚光灯下，面对台下数千名狂热挥舞荧光棒的观众时，你的能量交换机制是：", "台下的声浪是我获取能量的直接引擎，观众的反馈越激烈，我在舞台上的表现就越具有张力和侵略性。", "尽管身处聚光灯下，我的内心依然是在构建一个封闭的音乐结界，外界的狂热最终都会被我的内循环所过滤。"],
            [14, "S/N", "【信息感知】当听到弦卷心提出“在飞行中的飞艇上举办演唱会”这种离谱提议时，你的思维会走向：", "瞬间开始评估实现这个计划的物理阻碍，比如高空风速对收音的干扰、设备固定的力学问题。", "彻底被这个疯狂的概念击中，甚至开始在脑海中勾勒在云层之上奏响和弦那种打破现实边界的极致浪漫。"],
            [15, "T/F", "【决策逻辑】由于某首对乐队具有特殊纪念意义的老歌始终排练不到位，有人提议在关键 Live 上将其砍掉。你的立场是：", "坚定支持砍掉。情怀不能凌驾于演出质量之上，将瑕疵品搬上舞台是对所有买票观众和专业主义的背叛。", "坚决反对砍掉。这首歌承载着团队不可磨灭的共同历史，哪怕演奏得残缺不全，其情感的完整性也无可替代。"],
            [16, "J/P", "【生活方式】每次排练结束后，在整理散落一地的效果器、线材与谱面时，你的行为模式是：", "拥有强迫症般的归类欲，将所有线材整齐卷好并放入指定的隔层，确保下次使用时具备最高的效率。", "习惯性地将所有物品胡乱塞进包里，接受某种程度的混沌，直到下次排练急需某根连接线时再去翻找。"],
            [17, "E/I", "【能量导向】当长时间的创作瓶颈导致你面临极大的心理压力时，你最有效的自我修复途径是：", "召集朋友们去进行一场彻夜的 KTV 狂欢，通过置身于高分贝的外部刺激和集体共振中来粉碎压力。", "切断所有外部联系，独自潜入深夜的街道散步，或者戴上降噪耳机在绝对的孤独中完成自我精神的缝合。"],
            [18, "S/N", "【信息感知】当你的队友指着天边说：“你看，今天的晚霞红得就像一把正在失真咆哮的吉他。”你会：", "感到逻辑上的断层，认为用声学现象去比喻光学现象有些勉强，晚霞仅仅是光的散射而已。", "瞬间产生强烈的通感，不仅在脑海中生成了那副画面，甚至连下一首曲子的 Riff 灵感都被点燃了。"],
            [19, "T/F", "【决策逻辑】资本方提供了一笔极其丰厚的赞助，但要求你们改变现有的硬核曲风，转为迎合市场的口水歌。你会：", "倾向于妥协。生存和资金是乐队运转的物理基础，只有先拿到资源存活下来，未来才有资本反哺自己的音乐。", "断然拒绝。音乐是内在灵魂的外化，一旦为了资本扭曲了自我的表达，乐队就失去了存在的根本意义。"],
            [20, "J/P", "【生活方式】在推进原创歌曲的创作进度时，你的工作流呈现出怎样的特征？", "坚信纪律的力量，即便毫无灵感，也会强迫自己每天定时坐在工作台前产出小样，维持稳定的工作流。", "极度依赖状态的起伏，可能连续几周一笔不动，却能在某个凌晨因为突然降临的灵感，一口气完成所有的编曲。"],
            // --- 复杂版题库 (21-60) ---
            [21, "E/I", "【能量导向】当乐队因历史创伤陷入长期的死寂，排练室空气降至冰点。如同 MyGO 前期的割裂状态，你的破局本能是：", "采用强迫性的外部干预，甚至不惜引发激烈的争吵，认为“把积压在心里的垃圾全部砸出来”是唯一的解药。", "拒绝无意义的言语对峙，选择默默抱起乐器弹奏一段承载共同记忆的旋律，试图用非语言的场域重建连接。"],
            [22, "S/N", "【信息感知】面对 Ave Mujica 这样全员佩戴面具、以哥特式人偶为设定的企划，你的深层关注点在于：", "面具的材质是否影响视野、厚重的服装是否限制了吉他手的扫弦幅度，以及这种包装带来的实际商业转化率。", "剥离视觉奇观后，面具所隐喻的每个成员试图掩盖的现实创伤，以及这种“遗忘”哲学所传递的虚无主义美学。"],
            [23, "T/F", "【决策逻辑】发现队友像爽世那样，为了个人对前乐队的病态执念而暗中算计现任成员，真相揭露的时刻，你会：", "感到被背叛的愤怒，立刻从团队利益出发，冷酷地指出她的虚伪并将其边缘化，要求重新评估她的留队资格。", "尽管深受伤害，但依然能透视到她不择手段背后那种对“失去归宿”的极度恐惧，试图去触碰并治愈她的执念。"],
            [24, "J/P", "【生活方式】当如同祥子一样，突然单方面宣布解散乐队并彻底失联，作为被抛弃的一方，你最无法释怀的是：", "这种突如其来的断裂彻底粉碎了你原本为乐队规划好的所有清晰路径，让一切稳定的秩序瞬间陷入瘫痪。", "并非不能接受散伙的结果，而是无法容忍这种毫无商量余地、直接粗暴切断所有未知的可能性的专断行为。"],
            [25, "E/I", "【能量导向】作为类似 CHU2 那样的幕后制作人，在遭遇长期的创作瓶颈与外界质疑时，你的防御与重启机制是：", "冲出门去寻找其他乐手进行疯狂的 Battle，或者在社交媒体上发布更加狂妄的宣言，通过外部的对抗来刺激灵感。", "将自己反锁在装满屏幕的录音室里，切断一切物理社交，在绝对的孤独中与一堆毫无生命的数据和音轨死磕。"],
            [26, "S/N", "【信息感知】回顾 Roselia 从地下 Livehouse 艰难走向顶级赛事的历程，你认为其核心驱动力是：", "是每一天精确到分钟的残酷训练、对设备参数的极致把控，以及成员在客观演奏技术上的降维打击。", "是她们共同凝视着那个虚幻但至高的“顶点”，这种近乎宗教般的精神信仰超越了物理技术的局限。"],
            [27, "T/F", "【决策逻辑】面对竞争对手在硬实力上的客观碾压，你处理这种挫败感的逻辑是：", "坦然接受数据的落后，将其拆解为一个个可量化的技术差距指标，制定冷酷的赶超计划以图来日再战。", "拒绝被单一的实力评价体系定义。坚信我们拥有她们所缺失的“青梅竹马”的灵魂羁绊，这种温度才是真正的摇滚。"],
            [28, "J/P", "【生活方式】为了保证周年演唱会的完美无瑕，在统筹阶段，你的掌控欲体现为：", "建立极其繁冗的检查清单，要求所有灯光、走位必须经过无数次精确排练，拒绝任何不可控的风险。", "安排好大框架后便任其发展，甚至暗自期待现场能出现一些小的舞台事故，因为这种即兴的补救往往能成就经典。"],
            [29, "E/I", "【能量导向】如果像海铃那样以职业雇佣兵的身份游走于三十支乐队之间，你对这种高频社交轮转的态度是：", "乐在其中。能在不同的社交圈层中快速切换身份，这种丰富的人际交互和外部信息流能让你时刻保持兴奋。", "将其视为纯粹的物理交易。在演奏结束后立刻抽离，绝对不涉入任何私人情感的羁绊，以保护自己内心的能量。"],
            [30, "S/N", "【信息感知】在初次接触“将偶像文化与真实乐团结合”的 Pastel*Palettes 企划时，你的认知出发点是：", "这意味着需要同时进行舞蹈排练和乐器练习，双重物理负担下，她们的体力分配和假弹技术该如何无缝衔接？", "这是一个极具讽刺意味的隐喻：在资本打造的虚幻偶像躯壳下，到底什么才是摇滚乐中所谓的“真实”？"],
            [31, "T/F", "【决策逻辑】当粉丝寄来信件表示“虽然你们最近的 Live 演奏得乱七八糟，但我依然会被感动”时，你会：", "感到强烈的职业羞耻感。粉丝的溺爱不能掩盖业务能力低下，必须进行残酷的内部整改。", "被深深地触动。认为这恰恰证明了音乐超越技术瑕疵，乐队最大的价值本就是传递这种充满缺陷的真实人性。"],
            [32, "J/P", "【生活方式】面对突如其来的台风导致预定数月的户外音乐节面临取消风险，你的应对神经回路是：", "迅速进入止损模式，疯狂联系室内的备用场馆，并开始撰写条理清晰的退票与延期公告，极力维持秩序。", "骨子里的疯狂被点燃，心想“那就趁着风暴来一场不插电的泥泞狂欢吧”，极度享受这种被命运打乱的刺激感。"],
            [33, "E/I", "【能量导向】在遭遇严重的网络暴力和铺天盖地的不实黑料时，你的心理防线构建方式：", "战斗欲被激发。立刻在社交媒体上发布极具攻击性的回应，或者安排记者会，用高调的发声粉碎谣言。", "彻底切断外部信息源的输入。认为外界噪音毫无意义，只要内心知道真相，就用绝对的沉默和避世抵御伤害。"],
            [34, "S/N", "【信息感知】看到队友像灯一样，拿着一本写满破碎短句、毫不押韵的笔记本说这是新歌词时：", "感到极度的技术困扰。因为缺乏清晰结构和韵脚，在物理上根本无法填入标准的流行摇滚旋律中。", "被文字中那种原始、血淋淋的痛楚击穿。认为这种未经雕琢的破碎感才是灵魂本质，宁可修改曲子迁就它。"],
            [35, "T/F", "【决策逻辑】在招募填补核心空缺的新乐手时，有两位候选人摆在面前。你的录用标准是：", "选择那位性格孤僻古怪但技术达到神级、能瞬间拔高乐队水准的选手。实力是竞技场上的唯一通行证。", "选择那位技术稍显稚嫩但极具亲和力、能立刻用笑容融化排练室冰冷氛围的选手。情感和谐是长远发展的基石。"],
            [36, "J/P", "【生活方式】对于“设定目标”，你的底层认知模式更倾向于：", "“如果不设立像‘一年内动员一万人’这样可量化、有截点的指标，乐队的行动就会彻底失去方向和意义。”", "“目标只是虚无的标靶，我更在乎的是大家闭着眼睛疯狂向前奔跑时，那种失控却又极度自由的过程体验。”"],
            [37, "E/I", "【能量导向】当面临如同千圣童年时期那样，被要求时刻在镜头前维持虚假人设的高压环境，你会：", "迅速掌握这种外在表演的游戏规则，并从这种掌控他人目光的权力游戏中获取成就感与多巴胺。", "感到内心的真实自我被严重挤压和吞噬，必须在没有镜头的暗处建立一道坚固的心理围墙，否则便会崩溃。"],
            [38, "S/N", "【信息感知】你的队友提出了一段极度先锋、甚至完全脱离了乐队原有流派的编曲旋律。你的审视角度是：", "这段旋律在现有设备下能否被完美还原？台下的老粉丝是否具备接受这种突变编曲的听觉习惯？", "这段旋律打破了流派的囚笼！它预示着乐队正走向一个前所未有的进化阶段，其背后的实验精神令人着迷。"],
            [39, "T/F", "【决策逻辑】面对资本抛出的巨额合约，条件是乐队必须彻底放弃自己创作，改为演唱流水线的商业神曲：", "理性地接受。在这个残酷的产业里，活下来、拿到资源是第一要义。纯粹的理想主义只有在拥有资本后才有资格谈论。", "愤怒地撕毁合约。摇滚乐一旦失去自我表达，变成资本的牵线木偶，赚再多的钱也会让所有人陷入心理死亡。"],
            [40, "J/P", "【生活方式】乐队的公共账目和演出经费管理，在你的手中通常会变成：", "一份精确到小数点后两位的 Excel 表格。设定严格的基金名目，任何开销必须有据可查。", "一笔极度混沌的糊涂账。看到罕见效果器就先刷卡，等到交不起场地费时，大家再临时拼凑应对。"],
            [41, "E/I", "【能量导向】在一场惨败的音乐比赛后，更衣室里充满了自责与压抑。你会如何处理这种负面气场？", "刻意制造响动，提议大家去吃最辣的拉面，强行将大家从内部的自我否定中拉向外部的感官刺激。", "独自缩在长椅上复盘失误，认为每个人都需要时间独自舔舐伤口，过多的言语安慰反而是对沉淀的打扰。"],
            [42, "S/N", "【信息感知】评价一名伟大的吉他手，你认为最核心的特质在于：", "能够以每分钟 180 拍的速度完美无瑕演奏复杂琶音，且在任何高压环境下保持肌肉记忆的绝对稳定。", "能够用最简单的三个和弦，凭空勾勒出一整座城市的黄昏，每一次推弦都在诉说着一种哲学。"],
            [43, "T/F", "【决策逻辑】如果团队中出现了像喵梦那样，唯利是图、随时准备踩着别人争议事件上位的人：", "虽然道德上不齿，但在商业运作中，承认她的敏锐嗅觉对乐队扩展知名度具有不可替代的现实工具价值。", "感到极度排斥。坚决认为这种缺乏基本道德共情、利用他人伤疤的毒瘤行为，终将反噬整个团队的灵魂。"],
            [44, "J/P", "【生活方式】在构思下一张迷你专辑的曲目走向时，你的习惯是：", "在写下第一个音符前，就已经定好整张专辑起承转合的严密概念结构，甚至连封面主色调都已规划完毕。", "写到哪算哪，可能第一首朋克，第二首民谣。直到最后一刻，才尝试在这些混沌中寻找串联的线索。"],
            [45, "E/I", "【能量导向】如果被推选为某次联合大型 Live 的总指挥，你的管理风格是：", "频繁召开动员大会，穿梭在后台各休息室，通过面对面交谈统筹全局、鼓舞士气。", "坐在主控台前，通过对讲机和时间表发号施令。偏好维持距离感和幕后掌控感，多于面对面社交。"],
            [46, "S/N", "【信息感知】听闻某支地下乐队因为坚持过于冷门的音乐风格而面临解散危机，你的分析切入点是：", "他们的营销渠道太单一，曲目记忆点不足，缺乏吸引路人粉丝停下脚步的“抓耳”硬件条件。", "这是艺术向世俗投降的悲剧。他们宁为玉碎不为瓦全的悲壮精神，反映了浮躁时代对纯粹审美的驱逐。"],
            [47, "T/F", "【决策逻辑】面对乐队内部长期的、无法调和的理念分歧（如技术极致 vs 快乐至上）：", "理性提出拆分重组方案。承认强行绑定只会互相消耗，体面的分道扬镳才是最高效的止损。", "极力抗拒解散。试图发掘最初走到一起的微小闪光点，愿意无限度牺牲效率换取关系的苟延残喘。"],
            [48, "J/P", "【生活方式】在舞台上表演时，遇到了设备突然断电的严重事故。黑暗中，你的思维模式：", "大脑高速运转调取预案，立刻指挥检查备用电源，要求主唱进行脱口秀来控制场面秩序。", "顺应这种混乱，直接跳下舞台走到人群中清唱，把灾难变成一次打破第四堵墙的疯狂互动体验。"],
            [49, "E/I", "【能量导向】当有人像爱音那样，明明自己技术很差，却四处招摇炫耀自己加入了乐队。你的内心戏是：", "能够理解这种借由外界艳羡确认自身价值的渴望，这是一种将内部空虚转化为外部驱动力的社交手段。", "感到极其荒谬。真正的价值源于对技术的内省和音乐内核的坚持，而不是依附于他人目光的虚构泡沫。"],
            [50, "S/N", "【信息感知】决定乐队视觉形象风格时，你认为最重要的基石是：", "服装面料折射率、剪裁是否便于大幅度乐器扫弦，以及整体妆造的物理成本控制。", "这套视觉符号是否具有隐喻性，能否穿透现实表象，构建出一个独立于世俗的狂热精神乌托邦。"],
            [51, "T/F", "【决策逻辑】当一个水平极低但态度极好的成员，严重拖慢了全队进度时。作为主导者：", "进行冷酷剥离。直截了当告诉她实力差距，要求退居幕后或离队，保护多数人的时间成本。", "陷入道德挣扎。不忍心摧毁她的努力和梦想，宁愿全队无休止陪她加练冒着淘汰风险也不愿抛弃她。"],
            [52, "J/P", "【生活方式】对于自己的乐器（如吉他、贝斯），你的日常相处模式是：", "拥有严格保养时间表。每次练习后擦拭，温湿度恒定，视为需要精密维护的冰冷武器。", "乐器随处乱放，布满划痕和汗渍。认为这些未经打理的痕迹正是与它共同狂欢、随性生长的鲜活证据。"],
            [53, "E/I", "【能量导向】面对新一年的乐队招新季，学园里到处都是拉人入伙的社团。你的状态是：", "充满征服欲。拿着传单站在最显眼的路口，用极具煽动性的演说试图将每一个路过的学生卷入计划中。", "躲开喧嚣走廊，只在音乐室门上贴一张不起眼的招募启事，相信只有灵魂共频的人才会找来。"],
            [54, "S/N", "【信息感知】回顾 MyGO!!!!! 跌宕起伏的成军史，如果你要为其撰写一篇专访，切入角度会是：", "详细记录她们在各大会场的动员人数曲线，排练时BPM的调整记录，以及成员履历的客观堆叠。", "深入探讨一群“迷失者”如何在都市夹缝中，通过血肉模糊的互相刺伤，构建出极度真实的依赖哲学。"],
            [55, "T/F", "【决策逻辑】当像友希那早期那样，认为只有达到最高水准才配得上登台。你认为这种逻辑：", "是通向卓越的必然法则。只有建立极致的排他性和精英主义壁垒，才能在充斥平庸之辈的业界杀出血路。", "是一种冰冷的傲慢。音乐本质是沟通而非筛选，剥夺普通人感受音乐的权利违背了艺术的包容性。"],
            [56, "J/P", "【生活方式】在面临毕业季，乐队成员即将奔赴不同城市读大学的现实解体危机时：", "立刻召开严肃会议，要求明确未来去向，制定远距离异地排练的严格日程表，确保一切尽在掌控。", "拒绝提前焦虑。主张“只要大家今天还能在一起痛快地弹奏一曲就好”，将未知交还给时间去裁决。"],
            [57, "E/I", "【能量导向】如果拥有像日菜那样的绝对天才。面对拼命挣扎的凡人队友，你会：", "大声把感悟抛出去，手舞足蹈展示“只要这样 Boppin' 一下就出来了”，不明白为什么他们不跟上。", "选择在内心消化认知落差，独自在一旁迅速弹完自己的部分，将精神隔离在自己的绝对领域中。"],
            [58, "S/N", "【信息感知】对“摇滚精神”一词的理解，你的本能解码方式是：", "它体现在破旧皮衣、震耳欲聋失真音色、舞台真实汗水，以及叛逆生活方式这些可见可触的物理载体上。", "它是对既有体制和权威的深度质疑，是对人类内在自由的终极渴望。即便用木吉他安静弹奏也是摇滚。"],
            [59, "T/F", "【决策逻辑】为了让新歌达到极致张力，制作人建议你挖掘内心最深处不堪的创伤作为献祭。你会：", "理性评估。如果挖掘创伤确实能大幅提升作品商业价值和艺术深度，将痛苦工具化是可以接受的交易。", "产生强烈抵触。情感是神圣自留地，绝不能为了单纯演出效果去榨取和亵渎灵魂底线，这是残忍的自毁。"],
            [60, "J/P", "【生活方式】对于“乐队的终点”这个问题，你的深层预设是：", "终点是确定的。要么攀登顶峰后完美谢幕，要么无法维持生计后体面解散。一切应当有始有终、边界清晰。", "终点是不存在的。只要有一天还有人愿意拿起吉他，哪怕白发苍苍，这种和弦就永远会在宇宙某个角落回荡。"]
        ];

        // === APP STATE ===
        let currentMode = 'easy'; // 'easy' or 'hard'
        let currentQIndex = 0;
        let activeQuestions = [];
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        // === DOM ELEMENTS ===
        const screenHome = document.getElementById('screen-home');
        const screenQuiz = document.getElementById('screen-quiz');
        const screenResult = document.getElementById('screen-result');
        
        const qNumEl = document.getElementById('current-q-num');
        const qTotalEl = document.getElementById('total-q-num');
        const qTextEl = document.getElementById('question-text');
        const optAEl = document.getElementById('option-a-text');
        const optBEl = document.getElementById('option-b-text');
        const progressFill = document.getElementById('progress-fill');
        const modeBadge = document.getElementById('quiz-mode-badge');

        // Star Background Generation
        function initStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 50; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }

        function switchScreen(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden-screen');
            document.getElementById(hideId).classList.remove('flex');
            
            document.getElementById(showId).classList.remove('hidden-screen');
            document.getElementById(showId).classList.add('flex');
            // small trigger for animation
            document.getElementById(showId).classList.remove('fade-enter-active');
            void document.getElementById(showId).offsetWidth; // trigger reflow
            document.getElementById(showId).classList.add('fade-enter-active');
        }

        // === LOGIC ===
        function startQuiz(mode) {
            currentMode = mode;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            currentQIndex = 0;
            
            if (mode === 'easy') {
                activeQuestions = questionsDB.slice(0, 20);
                modeBadge.textContent = "日常简化版";
                modeBadge.className = "px-3 py-1 bg-cyan-900/50 text-cyan-300 text-xs rounded-full border border-cyan-500/30";
            } else {
                // Hard mode uses all 40 questions from index 20 to 60
                activeQuestions = questionsDB.slice(20, 60);
                modeBadge.textContent = "硬核剧情版";
                modeBadge.className = "px-3 py-1 bg-purple-900/50 text-purple-300 text-xs rounded-full border border-purple-500/30";
            }
            
            qTotalEl.textContent = activeQuestions.length;
            renderQuestion();
            switchScreen('screen-home', 'screen-quiz');
        }

        function renderQuestion() {
            const q = activeQuestions[currentQIndex];
            qNumEl.textContent = currentQIndex + 1;
            
            // Format: [id, "E/I", "QuestionText", "OptA", "OptB"]
            qTextEl.textContent = q[2];
            optAEl.textContent = q[3];
            optBEl.textContent = q[4];
            
            // Update progress bar
            const percent = ((currentQIndex) / activeQuestions.length) * 100;
            progressFill.style.width = `${percent}%`;
        }

        function selectOption(choice) {
            const q = activeQuestions[currentQIndex];
            const dimensions = q[1].split('/'); // e.g. ["E", "I"]
            
            if (choice === 'A') {
                scores[dimensions[0]]++;
            } else {
                scores[dimensions[1]]++;
            }
            
            currentQIndex++;
            
            if (currentQIndex < activeQuestions.length) {
                // Slight fade for text change
                const quizContent = document.getElementById('screen-quiz');
                quizContent.style.opacity = '0.5';
                setTimeout(() => {
                    renderQuestion();
                    quizContent.style.opacity = '1';
                }, 150);
            } else {
                progressFill.style.width = '100%';
                setTimeout(calculateAndShowResult, 400);
            }
        }

        function calculateAndShowResult() {
            // Determine MBTI
            const finalE = scores.E >= scores.I ? 'E' : 'I';
            const finalS = scores.S >= scores.N ? 'S' : 'N';
            const finalT = scores.T >= scores.F ? 'T' : 'F';
            const finalJ = scores.J >= scores.P ? 'J' : 'P';
            const mbti = `${finalE}${finalS}${finalT}${finalJ}`;
            
            const resultData = mbtiData[mbti];
            
            // Populate Result Screen
            document.getElementById('result-mbti').textContent = mbti;
            document.getElementById('result-title').textContent = resultData.title + " (" + resultData.axis + ")";
            document.getElementById('result-desc').textContent = resultData.desc;
            
            const charsContainer = document.getElementById('result-characters');
            charsContainer.innerHTML = '';
            
            resultData.roles.forEach(roleStr => {
                // Parse "Name (Band)"
                const match = roleStr.match(/(.+?)\s*\((.+?)\)/);
                let name = roleStr;
                let band = "";
                if(match) {
                    name = match[1];
                    band = match[2];
                }
                
                // Color mapping for bands roughly based on franchise colors
                let bandColor = "bg-gray-700";
                if(band.includes("Poppin")) bandColor = "bg-pink-600";
                if(band.includes("Roselia")) bandColor = "bg-blue-900";
                if(band.includes("Afterglow")) bandColor = "bg-red-600";
                if(band.includes("PasuPare") || band.includes("Pastel")) bandColor = "bg-teal-500";
                if(band.includes("HHW")) bandColor = "bg-yellow-500 text-black";
                if(band.includes("Morfonica")) bandColor = "bg-cyan-700";
                if(band.includes("RAS")) bandColor = "bg-green-600";
                if(band.includes("MyGO")) bandColor = "bg-indigo-600";
                if(band.includes("Ave Mujica")) bandColor = "bg-purple-900 border border-purple-500";

                const span = document.createElement('span');
                span.className = `px-3 py-1.5 rounded-md text-sm font-bold shadow-md ${bandColor}`;
                span.innerHTML = `${name} <span class="opacity-75 text-xs font-normal ml-1">${band}</span>`;
                charsContainer.appendChild(span);
            });

            switchScreen('screen-quiz', 'screen-result');
        }

        function resetApp() {
            switchScreen('screen-result', 'screen-home');
            progressFill.style.width = '0%';
        }

        // Initialize
        window.onload = () => {
            initStars();
        };
    </script>
</body>
</html>
